name: Android CI

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3

    - name: Make scripts executable
      run: |
        chmod +x gradlew
        chmod +x presentation/src/main/cpp/build.sh

    - name: Build libvpx
      run: |
        export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
        cd presentation/src/main/cpp && ./build.sh

    - name: Build Official Debug APK
      run: ./gradlew assembleOfficialDebug

    - name: Run Official Debug Unit Tests
      run: ./gradlew testOfficialDebugUnitTest

    - name: Upload Official Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: official-debug-apk
        path: app/build/outputs/apk/official/debug/*.apk

    - name: Build Telemt Debug APK
      run: ./gradlew assembleTelemtDebug

    - name: Run Telemt Debug Unit Tests
      run: ./gradlew testTelemtDebugUnitTest

    - name: Upload Telemt Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: telemt-debug-apk
        path: app/build/outputs/apk/telemt/debug/*.apk
